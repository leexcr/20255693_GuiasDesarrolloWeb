<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos de cafetería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="../js/pedidos.js" defer></script>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="text-center mb-4">Gestión de pedidos de la cafetería</h1>


      <div class="card mb-4">
        <div class="card-body">
          <form id="formPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-4">
                <label for="txtProducto" class="form-label">Producto</label>
                <input type="text" id="txtProducto" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label for="txtPrecio" class="form-label">Precio unitario ($)</label>
                <input type="number" id="txtPrecio" class="form-control" step="0.01" required />
              </div>
              <div class="col-md-4">
                <label for="txtCantidad" class="form-label">Cantidad</label>
                <input type="number" id="txtCantidad" class="form-control" step="1" required />
              </div>
            </div>
            <div id="mensajeError" class="alert alert-danger mt-3 d-none"></div>
            <button type="submit" id="btnAgregar" class="btn btn-primary mt-3">
              Agregar pedido
            </button>
          </form>
        </div>
      </div>


      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="txtPrecioMaximo" class="form-label">Precio máximo ($)</label>
              <input type="number" id="txtPrecioMaximo" class="form-control" step="0.01" />
            </div>
            <div class="col-md-8">
              <button type="button" id="btnFiltrar" class="btn btn-secondary">Filtrar productos</button>
              <button type="button" id="btnMostrarTodos" class="btn btn-outline-secondary">Mostrar todos</button>
              <button type="button" id="btnLimpiar" class="btn btn-danger">Limpiar pedidos</button>
            </div>
          </div>
        </div>
      </div>


      <table class="table table-striped table-bordered bg-white">
        <thead class="table-dark">
          <tr>
            <th>Producto</th>
            <th>Precio unitario</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>


      <p class="fs-5 mb-1">Total de unidades: <strong id="totalUnidades">0</strong></p>
      <p class="fs-5">Monto total: <strong id="montoTotal">$0.00</strong></p>
    </div>
  </body>
</html>
