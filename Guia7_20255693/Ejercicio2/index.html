<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet" />
    <title>Beauty Catalog | Maquillaje</title>
</head>

<body>
    <header>
        <h1>Beauty Catalog</h1>
        <p>Maquillaje de Sephora · datos obtenidos con la API de Sephora (RapidAPI)</p>
    </header>

    <main>
        <section class="panel-listado">
            <h2>Maquillaje</h2>
            <p id="mensajeListado" class="mensaje"></p>
            <div id="listadoProductos" class="listado"></div>
        </section>

        <aside class="panel-detalle">
            <h2>Detalle del producto</h2>
            <p id="mensajeDetalle" class="mensaje"></p>
            <div id="detalleProducto"></div>
        </aside>
    </main>

    <footer>
        <p>Ejercicio complementario 2 · Guía 7 · Desarrollo Web I</p>
    </footer>

    <script src="js/app.js" defer></script>
</body>

</html>
